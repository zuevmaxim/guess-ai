<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess AI</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
    .answer { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
    .answer.revealed { background: #e9ffe9; border-color: #7ad07a; font-weight: bold; }
    .players { margin: 10px 0; display: flex; gap: 16px; }
    .current { text-decoration: underline; }
    #log { margin-top: 12px; min-height: 24px; color: #333; }
    #startForm input { width: 220px; }
    #playersContainer { display: flex; flex-direction: column; gap: 8px; }
    #playersContainer input { width: 220px; }
    #progress { display: none; margin-top: 20px; }
    #progressBar { width: 100%; max-width: 500px; height: 30px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 5px; overflow: hidden; }
    #progressFill { height: 100%; background: linear-gradient(90deg, #4CAF50, #45a049); transition: width 0.3s ease; width: 0%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    #progressMessage { margin-top: 8px; color: #555; }
    #incorrectSection { margin-top: 30px; padding: 15px; background: #fff3f3; border: 1px solid #ffcccc; border-radius: 8px; }
    #incorrectSection h3 { margin-top: 0; color: #d32f2f; }
    #incorrectList { display: flex; flex-wrap: wrap; gap: 8px; }
    .incorrectItem { padding: 6px 12px; background: #ffe0e0; border: 1px solid #ffb3b3; border-radius: 4px; color: #c62828; font-size: 14px; }
    #start { position: relative; }
    .modelSelector { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 8px; }
    .modelSelector label { font-size: 14px; color: #555; }
    .modelSelector select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
<h1>Guess AI</h1>
<section id="start">
  <div class="modelSelector">
    <label for="modelSelect">Модель:</label>
    <select id="modelSelect">
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-5">gpt-5</option>
    </select>
  </div>
  <div id="startForm" class="row">
    <input id="topic" placeholder="Тема (например, Фильмы)" />
    <div id="playersContainer"></div>
    <button id="startBtn">Начать игру</button>
  </div>
  <div id="progress">
    <div id="progressBar">
      <div id="progressFill">0%</div>
    </div>
    <div id="progressMessage">Инициализация...</div>
  </div>
</section>
<section id="game" style="display:none">
  <div class="row">
    <div>Вопрос <span id="qIndex">1</span>/10:</div>
    <div id="question"></div>
  </div>

  <div class="answers" id="answers"></div>

  <div class="players" id="playersList"></div>

  <div class="row">
    <input id="guess" placeholder="Ваш ответ" />
    <button id="guessBtn">Отправить</button>
  </div>

  <div id="log"></div>

  <div id="incorrectSection" style="display:none">
    <h3>Неправильные ответы:</h3>
    <div id="incorrectList"></div>
  </div>
</section>

<script type="module">
const el = (id) => document.getElementById(id);
const startBtn = el('startBtn');
const topic = el('topic');
const modelSelect = el('modelSelect');
const playersContainer = el('playersContainer');
const guessInput = el('guess');
const guessBtn = el('guessBtn');
const answersDiv = el('answers');
const playersList = el('playersList');
const questionDiv = el('question');
const qIndexSpan = el('qIndex');
const logDiv = el('log');
const progressDiv = el('progress');
const progressFill = el('progressFill');
const progressMessage = el('progressMessage');
const incorrectSection = el('incorrectSection');
const incorrectList = el('incorrectList');

// Dynamic player input fields
function createPlayerInput(value = '') {
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = `Игрок ${playersContainer.children.length + 1}`;
  input.value = value;
  input.className = 'playerInput';
  
  input.addEventListener('input', () => {
    // If this is the last input and user started typing, add a new empty field
    const inputs = Array.from(playersContainer.querySelectorAll('.playerInput'));
    const lastInput = inputs[inputs.length - 1];
    if (input === lastInput && input.value.trim() !== '') {
      createPlayerInput();
    }
  });
  
  playersContainer.appendChild(input);
  return input;
}

// Initialize with one empty player input
createPlayerInput();

async function loadLastConfig() {
  try {
    const res = await fetch('/last-config');
    const config = await res.json();
    if (config && config.topic) {
      topic.value = config.topic;
      console.log('[UI] Prefilled topic:', config.topic);
    }
    if (config && config.model) {
      modelSelect.value = config.model;
      console.log('[UI] Prefilled model:', config.model);
    }
    if (config && config.players && config.players.length > 0) {
      // Clear existing inputs
      playersContainer.innerHTML = '';
      // Create input for each saved player
      config.players.forEach(player => createPlayerInput(player));
      // Add one empty field at the end
      createPlayerInput();
      console.log('[UI] Prefilled players:', config.players);
    }
  } catch (error) {
    console.error('[UI] Error loading last config:', error);
  }
}

async function pollProgress() {
  return new Promise((resolve, reject) => {
    const interval = setInterval(async () => {
      try {
        const res = await fetch('/progress');
        const progress = await res.json();
        
        // Update progress bar
        progressFill.style.width = `${progress.progress}%`;
        progressFill.textContent = `${progress.progress}%`;
        progressMessage.textContent = progress.message;
        
        console.log(`Progress: ${progress.progress}% - ${progress.message}`);
        
        // Check if ready
        if (progress.ready) {
          clearInterval(interval);
          resolve();
        } else if (progress.progress === 0 && progress.message.startsWith('Error:')) {
          clearInterval(interval);
          reject(new Error(progress.message));
        }
      } catch (error) {
        clearInterval(interval);
        reject(error);
      }
    }, 500); // Poll every 500ms
  });
}

async function startGame() {
  try {
    startBtn.disabled = true;
    topic.disabled = true;
    modelSelect.disabled = true;
    
    // Disable all player inputs
    const playerInputs = playersContainer.querySelectorAll('.playerInput');
    playerInputs.forEach(input => input.disabled = true);
    
    // Show progress bar
    progressDiv.style.display = 'block';
    progressFill.style.width = '0%';
    progressFill.textContent = '0%';
    progressMessage.textContent = 'Начинаем...';
    
    // Collect players from all non-empty input fields
    const players = Array.from(playerInputs)
      .map(input => input.value.trim())
      .filter(Boolean);
    const body = { 
      topic: topic.value || 'Общее', 
      players: players.length ? players : ['Игрок 1','Игрок 2'],
      model: modelSelect.value
    };
    console.log('Starting game with:', body);
    
    // Start game creation
    const response = await fetch('/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!response.ok) {
      throw new Error(`Server error: ${response.status}`);
    }
    const result = await response.json();
    console.log('Game start response:', result);
    
    // Poll for progress
    await pollProgress();
    
    // Hide progress, show game
    progressDiv.style.display = 'none';
    el('start').style.display = 'none';
    el('game').style.display = '';
    await refreshState();
  } catch (error) {
    console.error('Error starting game:', error);
    progressMessage.textContent = `Ошибка: ${error.message}`;
    progressMessage.style.color = 'red';
    startBtn.disabled = false;
    topic.disabled = false;
    modelSelect.disabled = false;
    
    // Re-enable all player inputs
    const playerInputs = playersContainer.querySelectorAll('.playerInput');
    playerInputs.forEach(input => input.disabled = false);
  }
}

async function refreshState() {
  const res = await fetch('/state');
  const state = await res.json();
  if (!state || !state.question) return;
  questionDiv.textContent = state.question;
  qIndexSpan.textContent = (state.currentIndex + 1).toString();

  // answers
  answersDiv.innerHTML = '';
  state.answers.forEach((a, idx) => {
    const div = document.createElement('div');
    div.className = 'answer' + (state.revealed[idx] ? ' revealed' : '');
    div.textContent = state.revealed[idx] ? `${idx+1}. ${a}` : `${idx+1}. —`;
    answersDiv.appendChild(div);
  });

  // players
  playersList.innerHTML = '';
  state.players.forEach((p, idx) => {
    const span = document.createElement('span');
    span.className = (idx === state.currentPlayerIndex) ? 'current' : '';
    span.textContent = `${p.name}: ${p.score}`;
    playersList.appendChild(span);
  });

  if (state.finished) {
    const winner = [...state.players].sort((a,b)=>b.score-a.score)[0];
    logDiv.textContent = `Игра окончена! Победитель: ${winner?.name} (${winner?.score} очков)`;
    guessInput.disabled = true;
    guessBtn.disabled = true;
  } else {
    logDiv.textContent = `Ход: ${state.currentPlayer}`;
  }

  // incorrect guesses
  if (state.incorrectGuesses && state.incorrectGuesses.length > 0) {
    incorrectSection.style.display = 'block';
    incorrectList.innerHTML = '';
    state.incorrectGuesses.forEach((guess) => {
      const span = document.createElement('span');
      span.className = 'incorrectItem';
      span.textContent = guess;
      incorrectList.appendChild(span);
    });
  } else {
    incorrectSection.style.display = 'none';
  }
}

async function submitGuess(v) {
  const body = { guess: v ?? guessInput.value };
  guessInput.value = '';
  const res = await fetch('/guess', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const result = await res.json();
  if (result.correct) {
    logDiv.textContent = `Правильно! +${result.points} за "${result.answer}"`;
  } else {
    logDiv.textContent = 'Не угадали!';
  }
  await refreshState();
}

startBtn.addEventListener('click', startGame);

guessBtn.addEventListener('click', () => submitGuess());

guessInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitGuess();
});

// Load last game configuration on page load
loadLastConfig();

</script>
</body>
</html>
